<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatchVibe - Live Sports & Football Scores</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #1e293b;
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #2563eb;
        }
        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            color: #38bdf8;
        }
        .logo span {
            color: #2563eb;
        }
        nav a {
            color: #94a3b8;
            text-decoration: none;
            margin-left: 1rem;
            font-weight: 500;
        }
        nav a:hover {
            color: #38bdf8;
        }
        .hero {
            text-align: center;
            padding: 2.5rem 1rem;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
        }
        .hero h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            color: #ffffff;
        }
        .hero p {
            color: #94a3b8;
            font-size: 1rem;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 1.5rem;
            width: 100%;
            flex: 1;
        }
        .section-title {
            font-size: 1.25rem;
            margin-bottom: 1rem;
            color: #38bdf8;
            border-left: 4px solid #2563eb;
            padding-left: 0.5rem;
        }
        .widget-card {
            background-color: #1e293b;
            border-radius: 12px;
            padding: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            margin-bottom: 2rem;
        }
        .ad-space {
            background-color: #334155;
            border: 2px dashed #64748b;
            border-radius: 8px;
            padding: 1.5rem;
            text-align: center;
            color: #94a3b8;
            font-size: 0.875rem;
            margin: 1.5rem 0;
        }
        footer {
            background-color: #1e293b;
            text-align: center;
            padding: 1rem;
            color: #64748b;
            font-size: 0.875rem;
            border-top: 1px solid #334155;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">Match<span>Vibe</span></div>
        <nav>
            <a href="#">Live Scores</a>
            <a href="#">Schedule</a>
        </nav>
    </header>

    <div class="hero">
        <h1>Live Sports & Score Hub</h1>
        <p>Follow real-time football scores, match schedules, and updates worldwide.</p>
    </div>

    <div class="container">
        <!-- Google AdSense Placeholder -->
        <div class="ad-space">
            📢 Ad Banner Space (MatchVibe Sponsored Content)
        </div>

        <div class="section-title">Today's Matches & Live Scores</div>
        <div class="widget-card">
            <!-- Football Live Score Widget -->
            <iframe id="sofa-standings-embed-37-41886" width="100%" height="600" src="https://widgets.sofascore.com/embed/unique-tournament/17/season/52376/standings/Premier%20League?widgetTitle=Premier%20League&showCompetitorCol=true" frameborder="0" scrolling="no" style="height:600px!important; stroke: #ffffff;"></iframe>
        </div>

        <!-- Secondary Ad Space -->
        <div class="ad-space">
            📢 Ad Banner Space (Google AdSense Ready)
        </div>
    </div>

    <footer>
        &copy; 2026 MatchVibe. All rights reserved.
    </footer>

</body>
</html>
